version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: isms-postgres
    environment:
      POSTGRES_USER: isms
      POSTGRES_PASSWORD: isms_secret
      POSTGRES_DB: isms
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isms -d isms"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [isms]

  redis:
    image: redis:7-alpine
    container_name: isms-redis
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [isms]

  backend:
    build: ./backend
    container_name: isms-backend
    environment:
      DATABASE_URL: postgresql://isms:isms_secret@postgres:5432/isms?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [isms]

  frontend:
    build: ./frontend
    container_name: isms-frontend
    depends_on:
      - backend
    networks: [isms]

  nginx:
    image: nginx:1.27-alpine
    container_name: isms-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [isms]

volumes:
  pgdata:

networks:
  isms:
    driver: bridge
